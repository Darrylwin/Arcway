# Configuration de Gitleaks : détection de secrets dans le code et l'historique Git.

title = "Arcway : règles de détection de secrets"

[extend]
# Reprend les règles intégrées. On n'écrit que ce qui est propre à ce projet.
useDefault = true

# Valeurs factices volontaires, uniquement dans les fichiers modèles.
# condition = "AND" : le chemin ET le mot factice doivent correspondre. Sans cela,
# un vrai secret contenant « change-me » serait ignoré partout dans le dépôt.
[[allowlists]]
description = "Valeurs factices des fichiers modèles"
condition = "AND"
paths = [
    '''(^|/)\.env\.example$''',
    '''(^|/)deploy/env/[^/]+\.env\.example$''',
]
stopwords = ["change-me"]

[[allowlists]]
description = "Fichiers dont le contenu n'est pas du code projet"
paths = [
    '''(^|/)\.mvn/wrapper/''',
]
