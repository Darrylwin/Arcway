# Profil des tests d'intégration. Flyway applique les vraies migrations sur le
# conteneur PostgreSQL

# src/test/resources/application-test.yaml
spring:
  main:
    banner-mode: "off"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

arcway:
  jwt:
    secret: test_jwt_secret_key_at_least_32_bytes_long_123456789
    access-token-expiration-minutes: 5
    refresh-token-expiration-days: 1
  cors:
    allowed-origins: "*"
  mail:
    from: test@arcway.app
    base-url: http://localhost:8080
