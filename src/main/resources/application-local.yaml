# Profil de développement : la base du compose.yaml, Flyway au démarrage.
# Les identifiants viennent du fichier .env à la racine du projet (voir .env.example).

spring:
  config:
    # Charge .env (format CLE=valeur) comme source de propriétés.
    # « optional » : pas d'échec s'il est absent ; les variables peuvent alors
    # venir de l'environnement du shell ou de l'IDE.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_HOST_PORT:5432}/${DB_NAME}
    # L'application tourne avec le rôle bridé, même en local.
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    enabled: true
    # Flyway ouvre sa propre connexion avec le rôle propriétaire (DDL).
    url: jdbc:postgresql://localhost:${DB_HOST_PORT:5432}/${DB_NAME}
    user: ${DB_MIGRATOR_USER}
    password: ${DB_MIGRATOR_PASSWORD}
