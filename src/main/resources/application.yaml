# Configuration commune à tous les environnements. Aucun secret ici.
# Les valeurs propres à un environnement vivent dans application-<profil>.yaml.

spring:
  application:
    name: arcway
    version: "@project.version@"

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Désactivé par défaut : en production, Flyway tourne dans une étape séparée.
    # Seul le profil local l'active au démarrage.
    enabled: false
  web:
    error:
      # Aucun détail interne dans les réponses d'erreur par défaut.
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness : l'instance sort du load balancer si la base est injoignable.
        # Liveness reste sans la base, pour qu'une panne de base ne provoque pas de redémarrages en boucle.
        readiness:
          include:
            - readinessState
            - db

server:
  shutdown: graceful
