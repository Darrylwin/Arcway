# =============================================================================
# Arcway : mises à jour automatiques des dépendances
# -----------------------------------------------------------------------------
# Trois écosystèmes : Maven, GitHub Actions, images Docker. Une PR par groupe
# et par semaine : le bruit reste faible, les correctifs de sécurité arrivent
# quand même immédiatement.
#
# Règles
#   - Java reste en 17 : les montées de version majeure de l'image Temurin
#     sont ignorées.
#   - Les messages de commit suivent la convention du projet (en anglais).
#   - Toute PR Dependabot passe la CI complète avant fusion, sans exception.
# =============================================================================
version: 2

updates:

  # ---------------------------------------------------------------------------
  # Maven : dépendances et plugins
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels: [ dependencies, java ]
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring-boot:
        patterns: [ "org.springframework.boot:*" ]
      testing:
        patterns:
          - "org.testcontainers:*"
          - "com.tngtech.archunit:*"
      security-libs:
        patterns: [ "org.bouncycastle:*" ]

  # ---------------------------------------------------------------------------
  # GitHub Actions : workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    labels: [ dependencies, ci ]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: [ "*" ]

  # ---------------------------------------------------------------------------
  # Docker : images de base du Dockerfile
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    labels: [ dependencies, docker ]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Java 17 imposé : pas de montée de version majeure du JDK/JRE
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
